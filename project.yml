name: 9Tracker
options:
  bundleIdPrefix: id.sragen
  deploymentTarget:
    iOS: "18.0"
configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig
settings:
  SWIFT_VERSION: "6.0"
targets:
  9Tracker:
    type: application
    platform: iOS
    sources: [9Tracker]
    info:
      path: 9Tracker/Info.plist
      properties:
        CFBundleDisplayName: 9Tracker
        UILaunchScreen: {}
        StravaClientID: $(STRAVA_CLIENT_ID)
        StravaClientSecret: $(STRAVA_CLIENT_SECRET)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [ninetracker]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.sragen.ninetracker
        PRODUCT_MODULE_NAME: NineTracker
        SWIFT_STRICT_CONCURRENCY: complete
        DEVELOPMENT_TEAM: 78WCZ448VT
        CODE_SIGN_STYLE: Automatic
    capabilities:
      - com.apple.security.application-groups
  9TrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [9TrackerTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: 9Tracker
schemes:
  9Tracker:
    build:
      targets:
        9Tracker: all
        9TrackerTests: [test]
    test:
      targets: [9TrackerTests]
    run:
      config: Debug
